limit_req_zone $binary_remote_addr zone=public_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=staff_login:1m rate=5r/m;
server {
    listen 80;
    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    location /static/ { alias /srv/static/; expires 1h; }
    location = /api/v1/auth/login/ {
        limit_req zone=staff_login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/(api|admin|health)/ {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
