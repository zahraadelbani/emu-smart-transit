services:
  migrate:
    environment:
      DEBUG: "true"
      DEMO_MODE: "true"
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_demo'
  backend:
    environment:
      DEBUG: "true"
      DEMO_MODE: "true"
  gps-worker:
    environment:
      DEBUG: "true"
      DEMO_MODE: "true"
    command: python manage.py poll_gps --provider simulation
